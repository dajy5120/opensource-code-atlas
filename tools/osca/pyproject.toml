[project]
name = "osca"
version = "0.1.0"
description = "OpenSource Code Atlas CLI: upstream tracking, [zh] annotation verification and translation status"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pathspec>=0.12",
    "jsonschema>=4.22",
]

[project.scripts]
osca = "osca.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
