schema: osca-terms/v1
domain: trading
description: 交易系统、市场微观结构与回测术语。
terms:
  order_book:       { en: Order Book, zh: 订单簿, avoid: [订单书, 委托簿] }
  order_book_delta: { en: Order Book Delta, zh: 订单簿增量 }
  order_book_depth: { en: Order Book Depth, zh: 盘口深度 }
  top_of_book:      { en: Top of Book, zh: 最优报价, note: 即 L1 买一/卖一 }
  bid:              { en: Bid, zh: 买价, note: 盘口语境可作“买盘” }
  ask:              { en: Ask, zh: 卖价, avoid: [询价], note: 盘口语境可作“卖盘” }
  spread:           { en: Spread, zh: 买卖价差, avoid: [传播, 扩散] }
  quote_tick:       { en: Quote Tick, zh: 报价 tick }
  trade_tick:       { en: Trade Tick, zh: 成交 tick }
  bar:              { en: Bar, zh: K 线, avoid: [柱子], note: 指 OHLC K 线数据 }
  market_data:      { en: Market Data, zh: 市场数据, avoid: [行情资料] }
  instrument:       { en: Instrument, zh: 交易品种, avoid: [仪器, 工具] }
  venue:            { en: Venue, zh: 交易场所, avoid: [场地, 地点] }
  exchange:         { en: Exchange, zh: 交易所 }
  order:            { en: Order, zh: 订单 }
  market_order:     { en: Market Order, zh: 市价单 }
  limit_order:      { en: Limit Order, zh: 限价单 }
  stop_order:       { en: Stop Order, zh: 止损单 }
  time_in_force:    { en: Time in Force, zh: 订单有效期, note: GTC/IOC/FOK 等 }
  fill:             { en: Fill, zh: 成交, avoid: [填充, 填写] }
  partial_fill:     { en: Partial Fill, zh: 部分成交 }
  slippage:         { en: Slippage, zh: 滑点 }
  position:         { en: Position, zh: 持仓, avoid: [位置] }
  position_side:    { en: Position Side, zh: 持仓方向 }
  long:             { en: Long, zh: 多头 }
  short:            { en: Short, zh: 空头 }
  netting:          { en: Netting, zh: 净额持仓, note: OMS 类型之一，与 hedging（对冲/双向持仓）对应 }
  hedging_oms:      { en: Hedging (OMS), zh: 双向持仓 }
  oms:              { en: OMS, zh: 订单管理系统（OMS） }
  ems:              { en: EMS, zh: 执行管理系统（EMS） }
  execution_engine: { en: Execution Engine, zh: 执行引擎 }
  execution_client: { en: Execution Client, zh: 执行客户端 }
  data_engine:      { en: Data Engine, zh: 数据引擎 }
  risk_engine:      { en: Risk Engine, zh: 风险引擎 }
  pre_trade_risk:   { en: Pre-trade Risk, zh: 事前风控 }
  portfolio:        { en: Portfolio, zh: 投资组合 }
  account:          { en: Account, zh: 账户 }
  margin:           { en: Margin, zh: 保证金, avoid: [边距] }
  leverage:         { en: Leverage, zh: 杠杆 }
  pnl:              { en: PnL, zh: 盈亏 }
  realized_pnl:     { en: Realized PnL, zh: 已实现盈亏 }
  unrealized_pnl:   { en: Unrealized PnL, zh: 未实现盈亏 }
  commission:       { en: Commission, zh: 手续费 }
  backtest:         { en: Backtest, zh: 回测 }
  strategy:         { en: Strategy, zh: 策略 }
  actor:            { en: Actor, zh: Actor, keep_english: true, note: NautilusTrader 中接收数据/事件的组件基类 }
  tick_size:        { en: Tick Size, zh: 最小价格变动单位 }
  lot_size:         { en: Lot Size, zh: 最小交易单位 }
  price_precision:  { en: Price Precision, zh: 价格精度 }
  liquidity_side:   { en: Liquidity Side, zh: 流动性方向, note: maker/taker }
  maker:            { en: Maker, zh: 挂单方 }
  taker:            { en: Taker, zh: 吃单方 }
  matching_engine:  { en: Matching Engine, zh: 撮合引擎, avoid: [匹配引擎] }
  reconciliation:   { en: Reconciliation, zh: 对账 }
  futures_contract: { en: Futures, zh: 期货 }
  perpetual:        { en: Perpetual Swap, zh: 永续合约 }
  option_contract:  { en: Option, zh: 期权, note: 与 Rust 的 Option 类型区分 }
  candlestick:      { en: Candlestick, zh: K 线图, aliases: [kline] }
  footprint_chart:  { en: Footprint Chart, zh: 足迹图, note: 在每根 K 线内按价位展示买卖成交量 }
  heatmap:          { en: Heatmap, zh: 热力图, note: 订单簿深度随时间变化的可视化 }
  volume_profile:   { en: Volume Profile, zh: 成交量分布 }
  time_and_sales:   { en: Time and Sales, zh: 逐笔成交 }
  dom_ladder:       { en: DOM Ladder, zh: 深度阶梯, note: DOM = Depth of Market }
  open_interest:    { en: Open Interest, zh: 持仓量, avoid: [开放兴趣] }
  funding_rate:     { en: Funding Rate, zh: 资金费率 }
  liquidation:      { en: Liquidation, zh: 强平, note: 也作“爆仓”，统一用“强平” }
  aggregated_trade: { en: Aggregated Trade, zh: 归集成交, aliases: [aggTrade] }
  ticker:           { en: Ticker, zh: 行情快照, note: 交易所 24h 统计行情；作为“交易代码”时译“代码” }
  timeframe:        { en: Timeframe, zh: 时间周期 }
  tick_chart:       { en: Tick Chart, zh: Tick 图, note: 按成交笔数而非时间聚合的 K 线 }
  imbalance:        { en: Imbalance, zh: 失衡 }
